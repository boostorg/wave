# This workflow uses the Boost.CI reusable workflow which builds a variety of
# configurations of a project, runs tests, and generates code coverage reports.
#
---
name: Boost.Wave

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - master
      - develop
      - bugfix/**
      - feature/**
      - fix/**
      - github/**
      - pr/**
    paths-ignore:
      - LICENSE
      - meta/**
      - README.md

jobs:
  call-boost-ci:
    name: Run Boost.CI
    uses: boostorg/boost-ci/.github/workflows/reusable.yml@master
    # Customization:
    with:
      enable_reflection: true
      b2_targets: libs/wave/test libs/wave/tool/build libs/wave/samples
      enable_cmake: false
      depinst_args: --include tool --include samples                       # fetch tool and sample dependencies
      enable_mingw: false                                                  # fails on non-ASCII test filename
      exclude_compiler: clang-3.5,clang-3.6,clang-3.7,clang-3.8,clang-5.0  # various compiler bugs
      exclude_jobs: >-
           type: windows, toolset: gcc                                     # fails on non-ASCII test filename
